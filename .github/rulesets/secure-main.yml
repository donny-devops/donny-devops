name: "Secure Main Branch"
target: branch
enforcement: active

rules:
  - type: required_signatures
  - type: required_linear_history
  - type: required_pull_request_reviews
    params:
      required_approving_review_count: 1
  - type: required_status_checks
    params:
      strict: true
      contexts:
        # Must match an actual reporting check, or PRs will be permanently
        # blocked. This is the "Green check" job from health.yml — the only
        # workflow that currently runs on pull_request. Add third-party
        # contexts (Socket Security, Debricked, Codacy, etc.) back here only
        # once those integrations are actually installed on this repo.
        - "Green check"
