name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f0b8f6f6d6a9f3e7a8c0d1e3c6b4a2f7c9d2e1a0
        with:
          egress-policy: block

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@8f9e8d8e3e6b9f3a1c0d2e7b4a5c6d7e8f9a0b1c # v4.0.2
        with:
          node-version: "20"
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
