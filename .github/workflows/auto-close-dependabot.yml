name: Auto-close Dependabot Issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  contents: read

concurrency:
  group: autoclose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoclose:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.merged == true

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f0b8f6f6d6a9f3e7a8c0d1e3c6b4a2f7c9d2e1a0
        with:
          egress-policy: block

      - name: Close related Dependabot issues
        uses: actions/github-script@9a0c1f4b7e3d2c6a1f8b0e7d4c3a2f1e0b9d8c7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });

            for (const issue of issues.data) {
              if (issue.title.toLowerCase().includes("dependabot")) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              }
            }
