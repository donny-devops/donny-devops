name: Repository Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Green check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate profile README exists
        run: test -f README.md

      - name: Validate Dependabot config exists
        run: test -f .github/dependabot.yml

      - name: Report status
        run: echo "Profile repository health checks passed."
