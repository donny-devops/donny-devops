# Dependabot configuration for the donny-devops profile repository.
# This repo contains profile README and workflow assets only, so only
# GitHub Actions updates are enabled. Add npm/docker/terraform later
# only after those package manifests exist in this repository.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    groups:
      actions-all:
        patterns:
          - "*"
